name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch: # Manual trigger from UI or API (used by "Update Data" button)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install duckdb pandas requests

      - name: Extract data from Last.fm (incremental)
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python extract.py NP26 < /dev/null

      - name: Commit updated DuckDB back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add music-dashboard/sources/music/warehouse.duckdb
          git diff --cached --quiet || git commit -m "chore: update warehouse.duckdb with latest scrobbles"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: music-dashboard/package-lock.json

      - name: Install npm dependencies
        working-directory: music-dashboard
        run: npm install

      - name: Run Evidence sources
        working-directory: music-dashboard
        run: npm run sources

      - name: Build Evidence site
        working-directory: music-dashboard
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'music-dashboard/build/Spotify-Streaming-History-Analysis'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
